services:

  postgres:
    image: postgres:17
    container_name: hireflow_postgres

    environment:
      POSTGRES_DB: hireflow_db
      POSTGRES_USER: hireflow_user
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: hireflow_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: hireflow_frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data: